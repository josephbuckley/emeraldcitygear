{{/* Custom head additions for Emerald City Gear */}}

<!-- Fanatics / Impact affiliate verification -->
<meta name='impact-site-verification' value='c912a6c6-eb7d-43a1-bdf5-517ef9957857'>

<!-- Favicon suite -->
<link rel="icon" type="image/png" sizes="32x32" href="/favicon.png">
<link rel="icon" type="image/png" sizes="16x16" href="/favicon.png">
<link rel="apple-touch-icon" sizes="180x180" href="/favicon.png">
<meta name="theme-color" content="#0C2C56">

<!-- Google Fonts: Inter for body, clean and modern -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Merriweather:wght@700&display=swap" rel="stylesheet">

<!-- Open Graph / Social sharing -->
<meta property="og:site_name" content="Emerald City Gear">
<meta property="og:locale" content="en_US">
{{ if .IsHome }}
<meta property="og:type" content="website">
<meta property="og:title" content="Emerald City Gear — Seattle Mariners Fan Guide">
<meta property="og:description" content="Streaming guides, gear picks, tickets, and fantasy tips for Seattle Mariners fans. Updated for the 2026 season.">
{{ else }}
<meta property="og:type" content="article">
{{ end }}

{{/* Gift-guide structured data: ItemList for pages with giftguide: true */}}
{{ if .Params.giftguide }}
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "ItemList",
  "name": {{ .Title | jsonify | safeJS }},
  "description": {{ .Params.description | default .Summary | jsonify | safeJS }},
  "url": {{ .Permalink | jsonify | safeJS }}{{ with .Params.gift_items }},
  "numberOfItems": {{ len . }},
  "itemListElement": [
    {{ range $i, $item := . }}{{ if $i }},{{ end }}
    {
      "@type": "ListItem",
      "position": {{ add $i 1 }},
      "name": {{ $item.name | jsonify | safeJS }}{{ with $item.image }},
      "image": {{ . | absURL | jsonify | safeJS }}{{ end }}
    }{{ end }}
  ]{{ end }}
}
</script>
{{ end }}
